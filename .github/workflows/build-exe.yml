name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Build Tauri Windows Executables (.exe)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination "release/"
          }
          if (Test-Path "src-tauri/target/release/KeyPulse.exe") {
            Copy-Item "src-tauri/target/release/KeyPulse.exe" -Destination "release/KeyPulse-Portable.exe"
          }
          Get-ChildItem release/

      - name: Upload .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyPulse-Windows-Executable
          path: release/*.exe
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
